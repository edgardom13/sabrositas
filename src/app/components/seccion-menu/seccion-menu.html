<section class="seccion" [id]="idSeccion()">
  <h2 class="titulo" [class.amarillo]="tema() === 'amarillo'" [class.verde]="tema() === 'verde'">
    @if (tema() === 'verde') { 🧊 }
    {{ titulo() }}
  </h2>
  <div class="grid">
    @for (producto of productos(); track producto.id) {
      <app-tarjeta-producto [producto]="producto" />
    }
  </div>
</section>
