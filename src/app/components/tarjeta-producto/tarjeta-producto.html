<article class="tarjeta">
  <div class="imagen">
    <img [src]="producto().imagen" [alt]="producto().nombre" />
    @if (cantidad > 0) {
      <span class="badge-cantidad">{{ cantidad }}</span>
    }
  </div>

  <div class="cuerpo">
    <h3>{{ producto().nombre }}</h3>
    <p class="precio">{{ formatearPrecio(producto().precio) }}</p>

    @if (cantidad === 0) {
      <button class="btn-agregar" [class.agregado]="agregado()" (click)="agregar()">
        @if (agregado()) { ¡AGREGADO! ✓ } @else { AGREGAR <span class="mas">+</span> }
      </button>
    } @else {
      <div class="contador">
        <button class="btn-menos" (click)="quitar()" aria-label="Quitar uno">−</button>
        <span class="cantidad">{{ cantidad }}</span>
        <button class="btn-mas" (click)="agregar()" aria-label="Agregar uno">+</button>
      </div>
    }
  </div>
</article>
