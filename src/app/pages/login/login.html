<div class="login-fondo">
  <!-- Patrón decorativo de fondo -->
  <div class="patron-superior"></div>
  <div class="patron-inferior"></div>

  <div class="login-card">
    <!-- Logo y marca -->
    <div class="login-header">
      <img src="img/logo.png" alt="Sabrositas" class="logo-login" />
      <h1>SABROSITAS</h1>
      <p class="subtitulo">Panel Administrativo</p>
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="iniciarSesion()" class="formulario-login">
      <div class="mensaje-bienvenida">
        <h2>Bienvenido de nuevo 👋</h2>
        <p>Ingresa tus credenciales para continuar</p>
      </div>

      <!-- Campo email -->
      <div class="campo">
        <label for="email">Correo electrónico</label>
        <div class="input-wrapper">
          <span class="icono-input">📧</span>
          <input
            id="email"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="admin@sabrositas.com"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <!-- Campo contraseña -->
      <div class="campo">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <span class="icono-input">🔒</span>
          <input
            id="password"
            [type]="mostrarPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="btn-ojo"
            (click)="alternarPassword()"
            [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            {{ mostrarPassword() ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <!-- Mensaje de error -->
      @if (error()) {
        <div class="alerta-error">
          <span class="icono-error">⚠️</span>
          <span>{{ error() }}</span>
        </div>
      }

      <!-- Botón de enviar -->
      <button
        type="submit"
        class="btn-login"
        [disabled]="enviando()"
      >
        @if (enviando()) {
          <span class="spinner"></span>
          <span>Iniciando sesión...</span>
        } @else {
          <span>INGRESAR AL PANEL</span>
          <span class="flecha">→</span>
        }
      </button>
    </form>

    <!-- Pie -->
    <div class="login-footer">
      <p>
        🔒 Acceso exclusivo para administradores
      </p>
      <a routerLink="/" class="volver-tienda">
        ← Volver a la tienda
      </a>
    </div>
  </div>

  <!-- Créditos -->
  <p class="creditos">
    © 2026 Sabrositas · Empanadas Fritas
  </p>
</div>
