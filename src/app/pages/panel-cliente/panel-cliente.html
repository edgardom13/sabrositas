<div class="dashboard" [class.menu-abierto]="menuAbierto()">

  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="img/logo.png" alt="Sabrositas" class="sidebar-logo" />
      <h1 class="sidebar-titulo">SABROSITAS</h1>
      <p class="sidebar-sub">Mi Cuenta 🎁</p>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item" [class.activo]="tab() === 'puntos'" (click)="cambiarTab('puntos')">
        <span class="nav-icono">⭐</span><span class="nav-texto">Mis puntos</span>
      </button>
      <button class="nav-item" [class.activo]="tab() === 'pedidos'" (click)="cambiarTab('pedidos')">
        <span class="nav-icono">🛒</span><span class="nav-texto">Mis pedidos</span>
      </button>
      <button class="nav-item" [class.activo]="tab() === 'premios'" (click)="cambiarTab('premios')">
        <span class="nav-icono">🏆</span><span class="nav-texto">Premios</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="usuario-info">
        <div class="avatar">{{ inicialNombre() }}</div>
        <div class="usuario-datos">
          <span class="usuario-nombre">{{ auth.perfil()?.nombre ?? 'Cliente' }}</span>
          <span class="usuario-email">{{ auth.usuario()?.email ?? '' }}</span>
        </div>
      </div>
      <button class="btn-salir" (click)="cerrarSesion()">🚪 Cerrar sesión</button>
    </div>
  </aside>

  @if (menuAbierto()) {
    <div class="overlay-movil" (click)="menuAbierto.set(false)"></div>
  }

  <div class="contenido">
    <header class="topbar">
      <button class="btn-hamburguesa" (click)="menuAbierto.set(true)">☰</button>
      <h2 class="topbar-titulo">{{ tituloTab }}</h2>
      <div class="topbar-derecha">
        <button class="btn-tema" (click)="alternarTema()">{{ tema.oscuro() ? '☀️' : '🌙' }}</button>
      </div>
    </header>

    <main class="contenido-principal">
      <div class="pagina-interna">
        @if (tab() === 'puntos') { <app-cliente-puntos /> }
        @if (tab() === 'pedidos') { <app-cliente-pedidos /> }
        @if (tab() === 'premios') { <app-cliente-premios /> }
      </div>
    </main>
  </div>
</div>
