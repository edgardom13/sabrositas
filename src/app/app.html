@if (cargando()) {
  <app-loading />
} @else if (!horario.abierto()) {
  <app-cerrado />
} @else {
  <app-header />

  <main>
    <app-hero appAparecer />

    <div class="menu-grid">
      <app-seccion-menu
        appAparecer
        idSeccion="empanadas"
        titulo="EMPANADAS FRITAS"
        tema="rojo"
        [productos]="empanadas"
      />
      <app-seccion-menu
        appAparecer
        idSeccion="jugos"
        titulo="JUGOS NATURALES"
        tema="amarillo"
        [productos]="jugos"
      />
      <app-seccion-menu
        appAparecer
        idSeccion="frios"
        titulo="FRÍOS"
        tema="rojo"
        [productos]="frios"
      />
      <app-seccion-menu
        appAparecer
        idSeccion="salsas"
        titulo="SALSAS"
        tema="amarillo"
        [productos]="salsas"
      />
    </div>
  </main>

  <app-beneficios appAparecer />

  <app-boton-carrito />
}
